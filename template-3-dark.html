<style>
:root{
  --paper:#F6F7FB; --ink:#14213D; --slate:#55607A; --line:#D5DAE7; --gold:#E8A317; --wash:#ECEFF7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0E1424; --ink:#E8ECF6; --slate:#9AA5BF; --line:#27304A; --gold:#F2B33A; --wash:#161E33;}
}
:root[data-theme="dark"]{--paper:#0E1424; --ink:#E8ECF6; --slate:#9AA5BF; --line:#27304A; --gold:#F2B33A; --wash:#161E33;}
html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth; height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--paper); color:var(--ink); font:400 1.0625rem/1.65 "Newsreader",Georgia,"Times New Roman",serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:46rem; margin:0 auto; padding:3.5rem 1.4rem 4rem}
h1,h2,.ui{font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:clamp(2.6rem,9vw,4.4rem); line-height:1; letter-spacing:-.03em; font-weight:600; margin:0 0 1rem}
.lede{font-size:1.3rem; line-height:1.45; max-width:34rem; margin:0 0 2.6rem; color:var(--slate)}
.lede em{color:var(--ink)}
/* contents page */
nav ol{list-style:none; margin:0; padding:0; border-top:2px solid var(--ink)}
nav li{border-bottom:1px solid var(--line)}
nav a{display:flex; align-items:baseline; gap:.6rem; padding:.7rem 0; color:var(--ink); text-decoration:none; font-weight:600; font-size:1.15rem}
nav a::after{content:""; order:1; flex:1; border-bottom:2px dotted var(--line); transform:translateY(-.3em)}
nav a span{order:2; font:400 .95rem "Newsreader",Georgia,serif; font-style:italic; color:var(--slate)}
nav a:hover::after,nav a:focus-visible::after{border-color:var(--gold)}
a:focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:2px}
section{margin-top:4rem}
h2{font-size:1.9rem; letter-spacing:-.02em; margin:0 0 1.2rem; font-weight:600; padding-bottom:.5rem; border-bottom:2px solid var(--ink)}
p{margin:0 0 1rem; max-width:40rem}
.row{display:grid; grid-template-columns:8rem 1fr; gap:.4rem 1.5rem; padding:1.1rem 0; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tag{font:500 .82rem/1.5 "Work Sans",system-ui,sans-serif; color:var(--slate); padding-top:.35rem}
.row h3{font:600 1.25rem/1.3 "Newsreader",Georgia,serif; margin:0 0 .15rem}
.row .where{color:var(--slate); font-style:italic; margin:0 0 .5rem}
.row p{margin:0 0 .6rem}
.chips{display:flex; flex-wrap:wrap; gap:.4rem; margin:.4rem 0 0; padding:0; list-style:none}
.chips li{font:500 .8rem "Work Sans",system-ui,sans-serif; background:var(--wash); border:1px solid var(--line); padding:.2rem .6rem; border-radius:99px}
a.link{color:var(--ink); text-decoration:underline; text-decoration-color:var(--gold); text-decoration-thickness:2px; text-underline-offset:.2em}
a.link:hover{text-decoration-color:var(--ink)}
.empty{color:var(--slate); font-style:italic; padding:.5rem 0}
.contact a.btn{display:inline-block; font:600 1rem "Work Sans",system-ui,sans-serif; background:var(--ink); color:var(--paper); padding:.8rem 1.3rem; border-radius:6px; text-decoration:none; margin:.3rem .5rem .3rem 0}
.contact a.btn.alt{background:transparent; color:var(--ink); border:2px solid var(--ink)}
footer{margin-top:4rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--slate); font-size:.9rem}
@media (max-width:34rem){.row{grid-template-columns:1fr}.tag{padding-top:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
figure{margin:1rem 0 0}figure img{display:block;max-width:min(100%,26rem);height:auto;border:1px solid var(--line)}figcaption{font:400 .85rem "Work Sans",system-ui,sans-serif;color:var(--slate);margin-top:.3rem}
:root,:root:not([data-theme="light"]){--paper:#0B0F14;--ink:#EDEFF2;--slate:#97A1B0;--line:#232B38;--gold:#3DD6C3;--wash:#131A24}
body{font:400 1rem/1.7 "Work Sans",system-ui,sans-serif}h1{font-weight:600;font-size:clamp(2.8rem,11vw,5.5rem);letter-spacing:-.04em}.lede{font:400 1.25rem/1.5 "Work Sans",system-ui,sans-serif}h2{border-bottom:0;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}.row h3{font:600 1.2rem "Work Sans",system-ui,sans-serif}nav ol{border-top:0}
</style>
